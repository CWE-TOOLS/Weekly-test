<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  var realFetch = window.fetch.bind(window);
  // Diagnostics: name any element / XHR request that fails, since the pane's console hides the URL.
  window.addEventListener('error', function (e) {
    var t = e.target; var u = t && (t.src || t.href);
    if (u) console.warn('[test copy] resource failed: ' + (t.tagName || '?') + ' ' + u);
  }, true);
  var xo = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) {
    this.addEventListener('loadend', function () { if (this.status >= 400) console.warn('[test copy] XHR ' + this.status + ' ' + m + ' ' + String(u).slice(0, 200)); });
    return xo.apply(this, arguments);
  };
  var blocked = 0;
  // Crates and crate assignments are LET THROUGH (they hit the real database) so trucks/crates can be tried here.
  function isWrite(url, method, body) {
    method = (method || 'GET').toUpperCase();
    if (method === 'GET' || method === 'HEAD' || method === 'OPTIONS') return false;
    if (/\/rest\/v1\/project_crates/i.test(url)) return false;
    if (/\/rest\/v1\/plant_schedule/i.test(url)) return false;   // the scheduler's own tables (preview) — nothing else reads them
    if (/\/rest\/v1\/casting_milestones/i.test(url)) return false;   // board milestones + inventory lock save for real
    if (/1a836a86-2709-4447-b604-d8e8a887bd0b|7a0554ad-5beb-4b73-83d7-c775f8ceff10/i.test(url + ' ' + String(body || '')) && /\/rest\/v1\/(batch_tickets|project_castings|casting_inventory)/i.test(url)) return false;   // 0860 "Test" casting: saves for real so live refresh can be tried
    if (/\/rest\/v1\/(sheets_cache|sheets_cache_status|rpc\/acquire_cache_update_lock|rpc\/release_cache_update_lock)/i.test(url)) return false;   // shared Google Sheets cache: same data whoever refreshes it; without this the board waits 30 s on a stale cache
    if (/\/rest\/v1\/casting_components/i.test(url) && /"crate_id"/.test(String(body || ''))) return false;
    return /\.supabase\.co\//i.test(url) || /sheets\.googleapis\.com|script\.google\.com/i.test(url);
  }
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var method = (init && init.method) || (input && input.method) || 'GET';
    var bodyText = (init && typeof init.body === 'string') ? init.body : '';
    if (!isWrite(url, method, bodyText)) return realFetch(input, init).then(function (res) {
      if (res && res.status >= 400) console.warn('[test copy] HTTP ' + res.status + ' from ' + method + ' ' + url.split('?')[0] + ' ?' + (url.split('?')[1] || '').slice(0, 160));
      return res;
    });
    blocked++;
    var badge = document.getElementById('ro-test-count');
    if (badge) badge.textContent = blocked + ' save' + (blocked === 1 ? '' : 's') + ' blocked';
    console.info('[read-only test copy] blocked', method, url.split('?')[0]);
    var prefer = '';
    try { var h = new Headers((init && init.headers) || (input && input.headers) || {}); prefer = h.get('Prefer') || ''; } catch (e) {}
    var wantsRows = /return=representation/i.test(prefer);
    return Promise.resolve(new Response(wantsRows ? '[]' : null, {
      status: wantsRows ? 200 : 204, headers: { 'Content-Type': 'application/json' } }));
  };
  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b91c1c;color:#fff;' +
      'font:700 13px/1.4 Segoe UI,Arial,sans-serif;padding:6px 14px;display:flex;gap:14px;justify-content:center;letter-spacing:.3px';
    bar.innerHTML = '<span>TEST SITE — READ-ONLY, except crates, trucks, the Releasability milestones / inventory lock and job 0860 casting "Test": those save to the real portal so you can try them. Everything else resets on refresh.</span>' +
      '<span id="ro-test-count" style="font-weight:400;opacity:.9">0 saves blocked</span>';
    document.body.appendChild(bar);
  });
})();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Data Fetch Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }
        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        .status.loading {
            background: rgba(255, 193, 7, 0.8);
            color: #212529;
        }
        .status.error {
            background: rgba(220, 53, 69, 0.8);
            color: #fff;
        }
        .status.success {
            background: rgba(40, 167, 69, 0.8);
            color: #fff;
        }
        pre {
            background: rgba(0, 0, 0, 0.8);
            color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.4;
            max-height: 600px;
            overflow-y: auto;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            h1 {
                font-size: 2em;
            }
            pre {
                font-size: 12px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Raw Data Fetch Demo</h1>
        <div id="status" class="status loading">Fetching data...</div>
        <button onclick="fetchData()">🔄 Refresh Data</button>
        <pre id="dataDisplay"></pre>
    </div>

    <script>
        async function fetchData() {
            const statusDiv = document.getElementById('status');
            const dataDisplay = document.getElementById('dataDisplay');

            statusDiv.className = 'status loading';
            statusDiv.textContent = 'Fetching data...';

            try {
                const response = await fetch('https://sheets.googleapis.com/v4/spreadsheets/1ReBnudzH_QAY6e45wwpf_sHd2OF1Akkppm0S7NmZ_ws/values/Primary%20Live%20List!A1:J?key=AIzaSyA0i2Mr7kVirmM72ggu_L7_3XAB3_EAsNw');

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                statusDiv.className = 'status success';
                statusDiv.textContent = 'Data fetched successfully!';

                dataDisplay.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `Error: ${error.message}`;
                dataDisplay.textContent = '';
            }
        }

        // Auto-fetch on page load
        fetchData();
    </script>
</body>
</html>
