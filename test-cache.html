<!DOCTYPE html>
<html>
<head>
<script>
(function () {
  var realFetch = window.fetch.bind(window);
  // Diagnostics: name any element / XHR request that fails, since the pane's console hides the URL.
  window.addEventListener('error', function (e) {
    var t = e.target; var u = t && (t.src || t.href);
    if (u) console.warn('[test copy] resource failed: ' + (t.tagName || '?') + ' ' + u);
  }, true);
  var xo = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) {
    this.addEventListener('loadend', function () { if (this.status >= 400) console.warn('[test copy] XHR ' + this.status + ' ' + m + ' ' + String(u).slice(0, 200)); });
    return xo.apply(this, arguments);
  };
  var blocked = 0;
  // Crates and crate assignments are LET THROUGH (they hit the real database) so trucks/crates can be tried here.
  function isWrite(url, method, body) {
    method = (method || 'GET').toUpperCase();
    if (method === 'GET' || method === 'HEAD' || method === 'OPTIONS') return false;
    if (/\/rest\/v1\/project_crates/i.test(url)) return false;
    if (/\/rest\/v1\/plant_schedule/i.test(url)) return false;
    if (/\/rest\/v1\/task_descriptions/i.test(url) && /0860/.test(url + ' ' + String(body || '')) && /casting_number(=eq\.|":")Test/.test(url + ' ' + String(body || ''))) return false;   // Staging task/hours on job 0860 casting "Test" save for real   // the scheduler's own tables (preview) — nothing else reads them
    if (/\/rest\/v1\/casting_milestones/i.test(url)) return false;   // board milestones + inventory lock save for real
    if (/1a836a86-2709-4447-b604-d8e8a887bd0b|7a0554ad-5beb-4b73-83d7-c775f8ceff10/i.test(url + ' ' + String(body || '')) && /\/rest\/v1\/(batch_tickets|project_castings|casting_inventory)/i.test(url)) return false;   // 0860 "Test" casting: saves for real so live refresh can be tried
    if (/\/rest\/v1\/(sheets_cache|sheets_cache_status|rpc\/acquire_cache_update_lock|rpc\/release_cache_update_lock)/i.test(url)) return false;   // shared Google Sheets cache: same data whoever refreshes it; without this the board waits 30 s on a stale cache
    if (/\/rest\/v1\/casting_components/i.test(url) && /"crate_id"/.test(String(body || ''))) return false;
    return /\.supabase\.co\//i.test(url) || /sheets\.googleapis\.com|script\.google\.com/i.test(url);
  }
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var method = (init && init.method) || (input && input.method) || 'GET';
    var bodyText = (init && typeof init.body === 'string') ? init.body : '';
    if (!isWrite(url, method, bodyText)) return realFetch(input, init).then(function (res) {
      if (res && res.status >= 400) console.warn('[test copy] HTTP ' + res.status + ' from ' + method + ' ' + url.split('?')[0] + ' ?' + (url.split('?')[1] || '').slice(0, 160));
      return res;
    });
    blocked++;
    var badge = document.getElementById('ro-test-count');
    if (badge) badge.textContent = blocked + ' save' + (blocked === 1 ? '' : 's') + ' blocked';
    console.info('[read-only test copy] blocked', method, url.split('?')[0]);
    var prefer = '';
    try { var h = new Headers((init && init.headers) || (input && input.headers) || {}); prefer = h.get('Prefer') || ''; } catch (e) {}
    var wantsRows = /return=representation/i.test(prefer);
    return Promise.resolve(new Response(wantsRows ? '[]' : null, {
      status: wantsRows ? 200 : 204, headers: { 'Content-Type': 'application/json' } }));
  };
  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b91c1c;color:#fff;' +
      'font:700 13px/1.4 Segoe UI,Arial,sans-serif;padding:6px 14px;display:flex;gap:14px;justify-content:center;letter-spacing:.3px';
    bar.innerHTML = '<span>TEST SITE — READ-ONLY, except crates, trucks, the Releasability milestones / inventory lock and job 0860 casting "Test" (inventory, batching, Staging tasks + hours): those save to the real portal so you can try them. Everything else resets on refresh.</span>' +
      '<span id="ro-test-count" style="font-weight:400;opacity:.9">0 saves blocked</span>';
    document.body.appendChild(bar);
  });
})();
</script>

    <title>Cache Status Check</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 10px 5px;
            font-size: 16px;
            cursor: pointer;
        }
        pre {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Sheets Cache Status</h1>
    <button onclick="checkCache()">Check Cache Status</button>
    <button onclick="clearCache()">Clear Cache (Test)</button>
    <pre id="output">Click "Check Cache Status" to view cache info...</pre>

    <script type="module">
        import { getCacheStats, clearCache as clearCacheFn } from './src/services/sheets-cache-service.js';

        window.checkCache = async () => {
            const output = document.getElementById('output');
            output.textContent = 'Loading...';

            try {
                const stats = await getCacheStats();
                output.textContent = JSON.stringify(stats, null, 2);
            } catch (err) {
                output.textContent = 'Error: ' + err.message;
                console.error(err);
            }
        };

        window.clearCache = async () => {
            if (confirm('Clear cache for testing?')) {
                const output = document.getElementById('output');
                output.textContent = 'Clearing cache...';
                try {
                    await clearCacheFn();
                    await checkCache();
                } catch (err) {
                    output.textContent = 'Error: ' + err.message;
                    console.error(err);
                }
            }
        };

        // Auto-check on load
        checkCache();
    </script>
</body>
</html>
