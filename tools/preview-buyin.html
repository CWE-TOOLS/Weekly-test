<!doctype html>
<html lang="en">
<head>
<script>
(function () {
  window.__SCHEDULER_CREW_PREVIEW = true;   // test site only: the weekly shows the Plant Scheduler's crew on its cards
  var realFetch = window.fetch.bind(window);
  // Diagnostics: name any element / XHR request that fails, since the pane's console hides the URL.
  window.addEventListener('error', function (e) {
    var t = e.target; var u = t && (t.src || t.href);
    if (u) console.warn('[test copy] resource failed: ' + (t.tagName || '?') + ' ' + u);
  }, true);
  var xo = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) {
    this.addEventListener('loadend', function () { if (this.status >= 400) console.warn('[test copy] XHR ' + this.status + ' ' + m + ' ' + String(u).slice(0, 200)); });
    return xo.apply(this, arguments);
  };
  var blocked = 0;
  // Crates and crate assignments are LET THROUGH (they hit the real database) so trucks/crates can be tried here.
  function isWrite(url, method, body) {
    method = (method || 'GET').toUpperCase();
    if (method === 'GET' || method === 'HEAD' || method === 'OPTIONS') return false;
    if (/\/rest\/v1\/plant_schedule/i.test(url)) return false;
    if (/\/rest\/v1\/task_descriptions/i.test(url) && /0860/.test(url + ' ' + String(body || '')) && /casting_number(=eq\.|":")Test/.test(url + ' ' + String(body || ''))) return false;   // Staging task/hours on job 0860 casting "Test" save for real   // the scheduler's own tables (preview) — nothing else reads them
    if (/\/rest\/v1\/(sheets_cache|sheets_cache_status|rpc\/acquire_cache_update_lock|rpc\/release_cache_update_lock)/i.test(url)) return false;   // shared Google Sheets cache: same data whoever refreshes it; without this the board waits 30 s on a stale cache
    return /\.supabase\.co\//i.test(url) || /sheets\.googleapis\.com|script\.google\.com/i.test(url);
  }
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var method = (init && init.method) || (input && input.method) || 'GET';
    var bodyText = (init && typeof init.body === 'string') ? init.body : '';
    if (!isWrite(url, method, bodyText)) return realFetch(input, init).then(function (res) {
      if (res && res.status >= 400) console.warn('[test copy] HTTP ' + res.status + ' from ' + method + ' ' + url.split('?')[0] + ' ?' + (url.split('?')[1] || '').slice(0, 160));
      return res;
    });
    blocked++;
    var badge = document.getElementById('ro-test-count');
    if (badge) badge.textContent = blocked + ' save' + (blocked === 1 ? '' : 's') + ' blocked';
    console.info('[read-only test copy] blocked', method, url.split('?')[0]);
    var prefer = '';
    try { var h = new Headers((init && init.headers) || (input && input.headers) || {}); prefer = h.get('Prefer') || ''; } catch (e) {}
    var wantsRows = /return=representation/i.test(prefer);
    return Promise.resolve(new Response(wantsRows ? '[]' : null, {
      status: wantsRows ? 200 : 204, headers: { 'Content-Type': 'application/json' } }));
  };
  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b91c1c;color:#fff;' +
      'font:700 13px/1.4 Segoe UI,Arial,sans-serif;padding:6px 14px;display:flex;gap:14px;justify-content:center;letter-spacing:.3px';
    bar.innerHTML = '<span>TEST SITE — READ-ONLY. Only the Plant Scheduler&#39;s own tables and job 0860 casting "Test" save for real; nothing here touches the live portal, the Optimizer or the weekly.</span>' + '<span id="ro-test-count" style="font-weight:400;opacity:.9">0 saves blocked</span>';
    document.body.appendChild(bar);
    var st = document.createElement('style');   // keep the banner off the page's bottom edge (scheduler scrollbar, floating boxes)
    st.textContent = '#sc-app{height:calc(100vh - ' + bar.offsetHeight + 'px) !important}body{padding-bottom:' + bar.offsetHeight + 'px}';
    document.head.appendChild(st);
  });
})();
</script>

<meta charset="utf-8">
<title>Buy-In preview</title>
<style>
/* Render the buy-in form as if @media print was active.
   Page emulates 11in × 8.5in (landscape letter) at 96 DPI = 1056 × 816 px,
   minus 0.5in margins = 960 × 720 px content area. */
html, body {
    margin: 0;
    padding: 0;
    background: #ddd;
}
.preview-stage {
    /* 10in × 7.5in @ 96 DPI — actual printable area for landscape letter
       after the printer's 0.5in @page margin. Keeps the preview honest
       about what fits on a single page. */
    width: 960px;
    height: 720px;
    margin: 24px auto;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    box-sizing: border-box;
    padding: 0;
}

/* === buy-in CSS (verbatim copy of what's in print.css for visual check) === */
.buy-in-report .print-page {
    page-break-after: always;
    page-break-inside: avoid;
    display: block !important;
    justify-content: flex-start !important;
    align-items: stretch !important;
    padding: 0.2in 0.6in 0.2in 0.6in !important;
    width: 100%;
    height: 100%;
    min-height: 6.8in;
    box-sizing: border-box;
    background: white;
    font-family: 'Calibri', 'Arial', Helvetica, sans-serif;
    color: #000;
}
.buy-in-company {
    text-align: right;
    font-size: 11pt;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-bottom: 0.12in;
}
.buy-in-summary {
    display: flex;
    gap: 0.5in;
    align-items: baseline;
    font-size: 14pt;
    font-weight: 700;
    margin-bottom: 0.18in;
}
.buy-in-summary-item {
    display: inline-flex;
    align-items: baseline;
    gap: 0.08in;
}
.buy-in-summary .buy-in-fill {
    display: inline-block;
    min-width: 2.2in;
    border-bottom: 1.5px solid #000;
    height: 1.1em;
}
.buy-in-currency, .buy-in-unit {
    font-weight: 700;
}
.buy-in-meta {
    display: flex;
    justify-content: space-between;
    gap: 0.6in;
    margin-bottom: 0.12in;
    font-size: 12pt;
}
.buy-in-meta-row {
    display: flex;
    align-items: baseline;
    gap: 0.12in;
}
.buy-in-meta-row:first-child {
    flex: 1;
}
.buy-in-meta .buy-in-label,
.buy-in-members .buy-in-label {
    font-weight: 700;
}
.buy-in-meta-row:first-child .buy-in-value {
    flex: 1;
}
.buy-in-meta .buy-in-value {
    font-weight: 500;
    border-bottom: 1.5px solid #000;
    min-width: 2.6in;
    padding: 0 0.05in 0.02in;
}
.buy-in-meta .buy-in-value.buy-in-crew-chip {
    display: inline-block;
    border-bottom: none;
    border-radius: 0.05in;
    padding: 0.05in 0.18in;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    min-width: 1.6in;
    text-align: center;
}
.buy-in-members {
    display: flex;
    align-items: baseline;
    gap: 0.12in;
    margin-bottom: 0.18in;
    font-size: 12pt;
}
.buy-in-members .buy-in-fill-wide {
    flex: 1;
    border-bottom: 1.5px solid #000;
    height: 1.2em;
}
.buy-in-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11pt;
    table-layout: fixed;
}
/* Never slice a row across pages if the sheet still overflows on an outlier printer */
.buy-in-table tr {
    page-break-inside: avoid;
    break-inside: avoid;
}
.buy-in-table th {
    font-size: 10pt;
    font-weight: 700;
    text-align: left;
    padding: 0.09in 0.12in;
    background-color: #DCDCDC;
    border: none;
    letter-spacing: 0.04em;
    vertical-align: middle;
}
.buy-in-table th.buy-in-th-actual,
.buy-in-table th.buy-in-th-percent {
    background-color: #FBE5C3;
}
.buy-in-table th.buy-in-th-day {
    line-height: 1.15;
}
.buy-in-th-day-main {
    display: block;
}
.buy-in-th-day-week {
    display: block;
    font-size: 9pt;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-top: 0.02in;
    color: #333;
}
.buy-in-table tbody td {
    padding: 0.17in 0.12in 0.06in 0.12in;
    font-weight: 500;
    vertical-align: bottom;
    font-size: 11pt;
}
.buy-in-table tbody td.buy-in-cell-expected,
.buy-in-table tbody td.buy-in-cell-actual,
.buy-in-table tbody td.buy-in-cell-delta,
.buy-in-table tbody td.buy-in-cell-percent {
    font-size: 14pt;
    text-align: center;
    position: relative;
}
.buy-in-table tbody td.buy-in-cell-expected:not(.buy-in-cell-split) > .buy-in-currency,
.buy-in-table tbody td.buy-in-cell-actual:not(.buy-in-cell-split) > .buy-in-currency,
.buy-in-table tbody td.buy-in-cell-delta:not(.buy-in-cell-split) > .buy-in-currency {
    position: absolute;
    left: 0.12in;
    bottom: 0.06in;
}
.buy-in-table tbody td.buy-in-cell-percent:not(.buy-in-cell-split) > .buy-in-unit {
    position: absolute;
    right: 0.12in;
    bottom: 0.06in;
}
.buy-in-table tbody td.buy-in-cell-expected:not(.buy-in-cell-split) > .buy-in-amount,
.buy-in-table tbody td.buy-in-cell-actual:not(.buy-in-cell-split) > .buy-in-amount,
.buy-in-table tbody td.buy-in-cell-delta:not(.buy-in-cell-split) > .buy-in-amount,
.buy-in-table tbody td.buy-in-cell-percent:not(.buy-in-cell-split) > .buy-in-amount {
    padding-left: 0;
    padding-right: 0;
    text-align: center;
}
.buy-in-table tbody td.buy-in-cell-day {
    padding-bottom: 0.1in;
    border-bottom: none;
    vertical-align: middle;
}
.buy-in-cell-day {
    font-weight: 500;
    width: 14%;
}
.buy-in-cell-expected,
.buy-in-cell-actual,
.buy-in-cell-delta,
.buy-in-cell-percent {
    width: 21.5%;
}
.buy-in-table tbody td.buy-in-cell-expected,
.buy-in-table tbody td.buy-in-cell-actual,
.buy-in-table tbody td.buy-in-cell-delta,
.buy-in-table tbody td.buy-in-cell-percent {
    border-bottom: 1.5px solid #000;
}
.buy-in-cell-expected,
.buy-in-cell-actual,
.buy-in-cell-delta,
.buy-in-cell-percent {
    white-space: nowrap;
}
.buy-in-table .buy-in-currency {
    display: inline-block;
    font-weight: 700;
    vertical-align: baseline;
}
.buy-in-table .buy-in-amount {
    display: inline-block;
    vertical-align: baseline;
    padding-left: 0.08in;
    padding-right: 0.05in;
}
.buy-in-cell-percent .buy-in-amount {
    padding-left: 0;
    padding-right: 0.08in;
    text-align: right;
}
.buy-in-cell-percent .buy-in-unit {
    display: inline-block;
    vertical-align: baseline;
    font-weight: 700;
}
.buy-in-table tbody tr:last-child td {
    padding-bottom: 0.12in;
}
.buy-in-total-row td {
    font-weight: 700;
    padding: 0.12in 0.12in 0.1in 0.12in !important;
    background-color: #DCDCDC;
    border-top: 2px solid #000;
    border-bottom: 1.5px solid #000;
    vertical-align: middle;
    font-size: 11pt;
    white-space: nowrap;
}
.buy-in-total-row td.buy-in-cell-expected,
.buy-in-total-row td.buy-in-cell-actual,
.buy-in-total-row td.buy-in-cell-delta,
.buy-in-total-row td.buy-in-cell-percent {
    font-size: 14pt;
    text-align: center;
    position: relative;
}
.buy-in-total-row td.buy-in-cell-expected:not(.buy-in-cell-split) > .buy-in-currency,
.buy-in-total-row td.buy-in-cell-actual:not(.buy-in-cell-split) > .buy-in-currency,
.buy-in-total-row td.buy-in-cell-delta:not(.buy-in-cell-split) > .buy-in-currency {
    position: absolute;
    left: 0.12in;
    top: 50%;
    transform: translateY(-50%);
}
.buy-in-total-row td.buy-in-cell-percent:not(.buy-in-cell-split) > .buy-in-unit {
    position: absolute;
    right: 0.12in;
    top: 50%;
    transform: translateY(-50%);
}
.buy-in-total-row td.buy-in-cell-expected:not(.buy-in-cell-split) > .buy-in-amount,
.buy-in-total-row td.buy-in-cell-actual:not(.buy-in-cell-split) > .buy-in-amount,
.buy-in-total-row td.buy-in-cell-delta:not(.buy-in-cell-split) > .buy-in-amount,
.buy-in-total-row td.buy-in-cell-percent:not(.buy-in-cell-split) > .buy-in-amount {
    padding-left: 0;
    padding-right: 0;
    text-align: center;
}
.buy-in-total-row td.buy-in-cell-day {
    padding-left: 0.12in !important;
    letter-spacing: 0.02em;
}
.buy-in-total-row .buy-in-cell-actual,
.buy-in-total-row .buy-in-cell-percent {
    background-color: #FBE5C3 !important;
}
</style>
</head>
<body>
